<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rarefind Team Board</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Projector board: the binder page at room scale. Rows are cards laid on the table, best score first. */
:root {
  --paper: #E9EDE5; --deep: #DDE2D8; --card: #FAFBF7; --ink: #12150F; --soft: #454B41; --faint: #575F52; --blaze: #D23C15;
  --holo: linear-gradient(135deg, #FF6FB1, #FFD45C 28%, #5CE6C8 55%, #6E8BFF 80%, #C77DFF);
  --display: 'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif; --body: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 clamp(16px, 1.4vw, 22px)/1.4 var(--body); overflow: hidden; }
.wrap { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: clamp(12px, 2vh, 28px); padding: clamp(16px, 3vh, 40px) max(20px, 4vw); }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.mark { font: 800 clamp(36px, 4.6vw, 76px)/0.9 var(--display); letter-spacing: -0.04em; display: inline-flex; align-items: flex-end; }
.mark i { width: .24em; height: .24em; border-radius: 50%; background: var(--holo); margin: 0 0 .14em .06em; }
h1 { font: 800 clamp(26px, 3vw, 52px)/1 var(--display); letter-spacing: -0.02em; margin: 0; }
.join { display: flex; align-items: center; gap: clamp(14px, 1.6vw, 26px); }
#qr { width: clamp(130px, 15vw, 300px); aspect-ratio: 1; padding: 8px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); }
#qr svg { width: 100%; height: 100%; display: block; }
.play { display: grid; gap: 6px; font: 500 clamp(14px, 1.3vw, 22px)/1.2 var(--mono); color: var(--soft); }
.play span { font: 800 clamp(22px, 2.4vw, 40px)/1 var(--display); color: var(--ink); letter-spacing: -0.02em; }
.play b { color: var(--ink); font-weight: 500; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(8px, 1.2vh, 14px); align-content: start; overflow: hidden; }
li { display: grid; grid-template-columns: clamp(44px, 4vw, 70px) clamp(54px, 5vw, 86px) minmax(0, 1fr) auto; align-items: center; gap: clamp(12px, 1.6vw, 26px); padding: clamp(8px, 1.2vh, 14px) clamp(14px, 1.6vw, 26px); border: 2px solid var(--ink); border-radius: 18px; background: var(--paper); transition: transform .4s ease; }
li.top { background: var(--card); box-shadow: 0 5px 0 var(--ink); }
li.top:first-child { border-width: 3px; }
.rank { font: 800 clamp(28px, 3vw, 54px)/1 var(--display); }
.thumb { aspect-ratio: 5 / 7; border: 2px solid var(--ink); border-radius: 10px; background: var(--deep) center / cover no-repeat; }
.team { min-width: 0; }
.team strong { display: block; font: 800 clamp(22px, 2.4vw, 42px)/1.05 var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team span { font: 500 clamp(15px, 1.4vw, 24px)/1.3 var(--mono); color: var(--faint); }
.score { font: 800 clamp(34px, 3.8vw, 68px)/1 var(--display); font-variant-numeric: tabular-nums; }
.empty { align-self: center; justify-self: center; text-align: center; display: grid; gap: 12px; }
.empty strong { font: 800 clamp(36px, 4vw, 70px)/1 var(--display); }
.just { font: 600 clamp(18px, 1.8vw, 30px)/1.2 var(--body); color: var(--soft); min-height: 1.2em; }
.just b { color: var(--ink); font-family: var(--display); font-weight: 800; }
footer { display: flex; justify-content: space-between; font: 500 clamp(12px, 1vw, 16px)/1 var(--mono); color: var(--faint); }
@media (max-width: 700px) { body { overflow: auto; } .play { text-align: left; } li { grid-template-columns: 36px 44px minmax(0, 1fr) auto; } }
@media (prefers-reduced-motion: reduce) { li { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="mark">rarefind<i></i></div>
      <h1>Team board</h1>
    </div>
    <div class="join"><div id="qr" aria-label="QR code for Quick play"></div><div class="play"><span>Scan to play</span><b>rarefind-production.up.railway.app/q</b></div></div>
  </header>
  <div id="just" class="just"></div>
  <ol id="board"></ol>
  <footer><span id="count"></span><span id="updated"></span></footer>
</div>
<script src="/vendor/qrcode.js"></script>
<script>
try {
  const q = qrcode(0, 'M');
  q.addData(location.origin + '/q');
  q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
} catch {}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let last = '', page = 0, pages = 1;
setInterval(() => { if (pages > 1) { page = (page + 1) % pages; last = ''; load(); } }, 8000);
async function load() {
  try {
    const r = await fetch('/api/board', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const { teams } = data;
    const key = JSON.stringify([page, data.lastRun, teams.map((t) => [t.team, t.best, t.plays])]);
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (key === last) return;
    last = key;
    const max = Math.max(4, Math.floor((window.innerHeight - 260) / 96));
    pages = Math.max(1, Math.ceil(teams.length / max));
    page = page % pages;
    const shown = teams.slice(page * max, page * max + max);
    const offset = page * max;
    const now = data.now || data.updatedAt || Date.now();
    const just = data.lastRun && now - data.lastRun.at < 90_000 ? data.lastRun : null;
    document.getElementById('just').innerHTML = just ? `<b>${esc(just.team)}</b> just scored <b>${just.score}</b>` : '';
    document.getElementById('count').textContent = teams.length ? `${teams.length} ${teams.length === 1 ? 'team' : 'teams'} played` : '';
    document.getElementById('board').innerHTML = shown.length
      ? shown.map((t, i) => `<li class="${offset + i < 3 ? 'top' : ''}">
          <span class="rank">${offset + i + 1}</span>
          <span class="thumb" style="${t.bestCard ? `background-image:url('${esc(t.bestCard.photo)}')` : ''}"></span>
          <span class="team"><strong>${esc(t.team)}</strong><span>${t.plays} ${t.plays === 1 ? 'run' : 'runs'}${t.bestCard ? ' · ' + esc(t.bestCard.title) : ''}</span></span>
          <span class="score">${t.best}</span>
        </li>`).join('')
      : `<li class="empty" style="border:0;background:none"><strong>No teams yet</strong><span>Open Quick play and go first.</span></li>`;
  } catch {
    document.getElementById('updated').textContent = 'Reconnecting';
  }
}
load();
setInterval(load, 4000);
</script>
</body>
</html>
